# requirements.lock — the exact resolution this tree was built and tested against.
#
# Why this file exists. `pyproject.toml` declares compatible *ranges*, which is
# right for a library and wrong for a submission that has to still work in
# October. This tree resolved google-adk 2.6.2; a fresh clone a day later
# resolved 2.7.0, and ADK is already emitting a deprecation warning about its
# own config loading. Judging runs to Oct 1. A range means "whatever PyPI has
# that morning", and the difference between a green clone and a red one should
# not be a package release nobody in this repository chose.
#
# Generated with:
#     .venv/bin/pip freeze --exclude-editable
#
# `make install` prefers this file and falls back to the ranges in
# pyproject.toml if it is absent. To refresh deliberately: install from the
# ranges, run `make gate`, and regenerate.
#
# Closes AGENTS.md constraint 8, which referenced a lockfile that did not exist.
#
# WHAT THIS FILE DOES NOT COVER, stated rather than implied. It was resolved on
# the interpreter named below, and `deploy/Dockerfile.*` does **not** install
# from it — those images build on python:3.11-slim and resolve from the ranges
# in pyproject.toml, which is why the `google-adk` range there is now bounded to
# the tested minor as well. Wiring this file into the images without building
# them on 3.11 first would be a pin nobody has verified, which is worse than a
# range somebody has.
# Resolved on: macOS-15.7.5-arm64-arm-64bit-Mach-O python 3.14.5
#
