# Cloud Scheduler — the nightly reconcile trigger (BAR-021, BAR-410).
#
# This file is the source of truth for the schedule. `scripts/bootstrap_gcp.sh`
# reads `schedule:`, `timeZone:`, `attemptDeadline:` and the retry block out of
# it and passes them to `gcloud scheduler jobs create/update http` — it does not
# keep its own copy. Changing the cadence means changing this file, which means
# the change appears in a diff instead of in somebody's shell history.
#
# (Cloud Scheduler has no `gcloud ... replace <file>` verb the way Cloud Run
# does, so this is a read-and-pass rather than a true declarative apply. That is
# a real difference and it is named here rather than implied by the file
# extension.)
#
# ---------------------------------------------------------------------------
# WHY 03:17Z, AND WHY THE RUN ID IS NOT IN THIS FILE
#
# 03:17 rather than 03:00: the top of the hour is when every cron on the
# platform fires, and a queued trigger that lands minutes late is a night that
# reads as missing in the execution history.
#
# 03:17 rather than 23:47: the run ID is derived from the *UTC day* inside the
# container (see deploy/entrypoint-job.sh). A trigger close to midnight could
# have its retries land on the far side of a date boundary and mint a second run
# ID for the same night, which would append a second heartbeat and turn the
# nightly count into a count of attempts. Firing in the small hours puts the
# whole retry window inside one UTC day.
#
# The run ID is absent from the request on purpose. Cloud Scheduler cannot
# inject a per-run timestamp into the Job's container. A literal `--run-id`
# configured anywhere in this chain would be byte-identical every night; event
# IDs are content hashes, so night two's heartbeat would collide with night
# one's, be dropped as a duplicate, and the heartbeat count would sit at 1
# while the execution history kept growing. The container composes the run ID
# instead (deploy/entrypoint-job.sh), and BAR-021's evidence stays real.
#
# ---------------------------------------------------------------------------
# WHY THE TARGET IS A SERVICE, NOT THE JOBS ADMIN API
#
# The original target was the Run Jobs Admin API `:run` URL with an OAuth
# token. It returned 403 on every attempt with every documented grant in place
# and individually verified; admin-activity audit logs showed no request
# authenticated as baraza-reconcile ever reaching the Run API from Scheduler,
# while the same SA's own token against the identical URL started executions.
# The defect was Scheduler's OAuth token minting for that path, not IAM — see
# STOPPED-DEPLOY.md (2026-08-15, update 2026-08-31).
#
# The target is now the baraza-trigger Cloud Run service
# (src/baraza/reconcile/trigger_service.py), reached with an OIDC token —
# Scheduler -> OIDC -> Cloud Run service is the supported, well-trodden path.
# The service runs as baraza-reconcile and makes the `jobs.run` call itself,
# with the constant containerOverride that sets
# BARAZA_RUN_TRIGGER=cloud-scheduler. That override lives in the service, not
# here: it is the property "only the Scheduler path is labelled scheduled",
# and a property enforced by one constant in one code path beats one that any
# edit to a YAML body could quietly change.
# ---------------------------------------------------------------------------

name: baraza-reconcile-nightly

description: >-
  BAR-021 nightly reconcile trigger. Runs the baraza-reconcile Cloud Run Job in
  whichever mode the Job is currently configured for (stub until BAR-321 lands,
  real afterwards; the Job is replaced in place so the execution history is
  continuous and the changeover date is identifiable in it). Every run this
  produces is a scheduled run and is labelled as such in any accounting — it is
  never counted as organic activity.

# 03:17 every day, UTC. See the note above.
schedule: "17 3 * * *"
timeZone: "Etc/UTC"

# 30 minutes. A stub run finishes in seconds; the real reconciler's ceiling is
# one bounded Vertex call per claim written since the last heartbeat, and this
# deadline is what stops a wedged call from holding an execution open all night.
attemptDeadline: "1800s"

retryConfig:
  # Three attempts, then leave the night missing. A silently-retried-forever job
  # produces an execution history that looks healthy while the work never
  # completes; a gap is legible.
  retryCount: 3
  minBackoffDuration: "30s"
  maxBackoffDuration: "300s"
  maxRetryDuration: "3600s"
  maxDoublings: 3

httpTarget:
  # `__TRIGGER_URL__` is the deployed baraza-trigger service URL, known only
  # after the service exists; bootstrap substitutes it after deploying the
  # service and before creating this trigger.
  uri: __TRIGGER_URL__/run-reconcile
  httpMethod: POST
  oidcToken:
    # The Scheduler authenticates as the same identity the Job runs as. Not a
    # shortcut to avoid a fifth service account — the least-privilege answer:
    # this identity holds `roles/run.invoker` on exactly two resources, the
    # baraza-trigger service and the baraza-reconcile Job, so the identity that
    # can trigger the reconciler is exactly the identity that does the
    # reconciler's work, and nothing else can do either. The Scheduler service
    # agent's tokenCreator grant on this SA (made 2026-08-15) is what lets it
    # mint the OIDC token.
    serviceAccountEmail: baraza-reconcile@__PROJECT_ID__.iam.gserviceaccount.com
    # OIDC audience must be the receiving service's own URL or Cloud Run's
    # IAM check rejects the token.
    audience: __TRIGGER_URL__
